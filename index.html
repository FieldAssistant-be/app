<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de `flutter build web --base-href`. -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Field Assistant : planning, interventions, bons, devis et stock de votre équipe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3EEE5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15181D" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Field Assistant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Field Assistant</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #F3EEE5; --card: #FCFAF6; --ink: #24211D; --muted: #6B645B;
      --line: #E4DCCF; --accent: #E8710A; --on-accent: #24211D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181D; --card: #1D2128; --ink: #ECEEF1; --muted: #A2AAB5;
        --line: #2B313A; --accent: #C9773F; --on-accent: #15181D;
      }
    }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      box-sizing: border-box; text-align: center;
    }
    .logo { width: 56px; height: 56px; border-radius: 14px; }
    .title { font-size: 22px; font-weight: 700; margin: 0; }
    .text { color: var(--muted); max-width: 360px; line-height: 1.45; margin: 0; }
    .bar { width: 160px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    .btn {
      display: block; width: 100%; max-width: 320px; box-sizing: border-box;
      padding: 14px 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
      text-decoration: none; border: 1px solid var(--line); background: var(--card);
      color: var(--ink); cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <!-- Pendant le chargement (premier passage : quelques secondes). -->
  <div id="loading" class="screen">
    <img class="logo" src="icons/Icon-192.png" alt="">
    <p class="title">Field Assistant</p>
    <div class="bar"></div>
  </div>

  <!-- Lien d'un e-mail (invitation, mot de passe) ouvert sur un téléphone :
       l'app installée, ou le navigateur. -->
  <div id="choose" class="screen" hidden>
    <img class="logo" src="icons/Icon-192.png" alt="">
    <p class="title">Field Assistant</p>
    <p class="text">Si l’app Field Assistant est installée sur ce téléphone, ouvrez-y ce lien pour choisir votre mot de passe.</p>
    <a id="open-app" class="btn primary" href="#">Ouvrir dans l’app</a>
    <button id="stay" class="btn" type="button">Continuer dans le navigateur</button>
  </div>

  <script>
    (function () {
      function start() {
        var s = document.createElement("script");
        s.src = "flutter_bootstrap.js";
        s.async = true;
        document.body.appendChild(s);
      }
      // L'écran de chargement disparaît dès la première image de l'app.
      window.addEventListener("flutter-first-frame", function () {
        var l = document.getElementById("loading");
        if (l) l.remove();
      });

      // Anti-clickjacking : jamais dans un cadre d'un autre site (GitHub
      // Pages ne permet pas l'en-tête X-Frame-Options / frame-ancestors).
      if (window.top !== window.self) {
        document.getElementById("loading").hidden = true;
        var framed = document.getElementById("choose");
        framed.hidden = false;
        framed.querySelector(".text").textContent =
          "Field Assistant ne s’affiche pas à l’intérieur d’un autre site.";
        var open = document.getElementById("open-app");
        open.textContent = "Ouvrir Field Assistant";
        open.href = window.location.href;
        open.target = "_top";
        open.rel = "noopener";
        document.getElementById("stay").remove();
        return;
      }

      var hash = window.location.hash || "";
      var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      // Session transmise dans l'adresse (invitation d'un technicien, lien
      // « choisir un mot de passe » envoyé par le serveur).
      if (phone && hash.indexOf("access_token=") !== -1) {
        document.getElementById("loading").hidden = true;
        document.getElementById("choose").hidden = false;
        document.getElementById("open-app").href =
          "fieldassistant://auth-callback" + hash;
        document.getElementById("stay").onclick = function () {
          document.getElementById("choose").hidden = true;
          document.getElementById("loading").hidden = false;
          start();
        };
        return;
      }
      start();
    })();
  </script>
</body>
</html>
